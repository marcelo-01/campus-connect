services:
  postgres:
    image: postgres:18-alpine
    container_name: campusconnect-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-campusconnect}
      POSTGRES_USER: ${DB_USER:-campusconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campusconnect}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 o volume da imagem e /var/lib/postgresql, nao mais .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
