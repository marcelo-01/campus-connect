services:
  postgres:
    image: postgres:18-alpine
    container_name: campusconnect-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-campusconnect}
      POSTGRES_USER: ${DB_USER:-campusconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campusconnect}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 o volume da imagem e /var/lib/postgresql, nao mais .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caixa de entrada de mentira para o desenvolvimento: o backend manda os e-mails para a porta 1025, e eles aparecem
  # em http://localhost:8025, sem sair para a internet.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: campusconnect-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
