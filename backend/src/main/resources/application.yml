spring:
  application:
    name: campus-connect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusconnect}
    username: ${DB_USER:campusconnect}
    password: ${DB_PASSWORD:campusconnect}
  jpa:
    # O Flyway e dono do schema; o Hibernate apenas confere as entidades contra ele.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # O maior arquivo aceito e o video de uma publicacao (50 MB). O limite das imagens
      # (5 MB) e conferido no ImagemService. O frontend avisa antes de enviar; aqui e a garantia.
      max-file-size: 50MB
      # Uma publicacao leva ate 4 imagens de 5 MB ou 1 video de 50 MB, mais o JSON.
      max-request-size: 60MB

server:
  tomcat:
    # Sem isso, num upload acima do limite o Tomcat fecha a conexao e o navegador ve
    # "erro de rede" em vez da resposta 413 com a mensagem.
    max-swallow-size: 100MB

campusconnect:
  seguranca:
    # Chave HMAC do JWT em Base64 (>= 32 bytes). Em producao, defina JWT_SECRET.
    # Vazia: gera uma chave aleatoria a cada subida (os JWTs antigos deixam de valer,
    # mas o frontend renova a sessao sozinho pelo refresh token).
    jwt-segredo: ${JWT_SECRET:}
    duracao-acesso: 15m
    # Refresh token com "Manter conectado" marcado.
    duracao-refresh: 30d
    # Refresh token sem "Manter conectado" (o cookie tambem some ao fechar o navegador).
    duracao-refresh-sessao: 1d
    # Secure: o cookie so trafega em HTTPS. Navegadores aceitam em http://localhost.
    cookie-seguro: ${COOKIE_SEGURO:true}
  arquivos:
    # Pasta das imagens enviadas (fotos e capas). Relativa a pasta em que a aplicacao sobe.
    diretorio: ${ARQUIVOS_DIR:uploads}
