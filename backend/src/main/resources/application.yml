spring:
  application:
    name: campus-connect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusconnect}
    username: ${DB_USER:campusconnect}
    password: ${DB_PASSWORD:campusconnect}
  jpa:
    # O Flyway e dono do schema; o Hibernate apenas confere as entidades contra ele.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # O maior arquivo aceito e o video de uma publicacao (50 MB). O limite das imagens
      # (5 MB) e conferido no ImagemService. O frontend avisa antes de enviar; aqui e a garantia.
      max-file-size: 50MB
      # Uma publicacao leva ate 4 imagens de 5 MB ou 1 video de 50 MB, mais o JSON.
      max-request-size: 60MB

  mail:
    # Em dev, o Mailpit do docker-compose.yml (caixa de entrada em http://localhost:8025).
    # Em producao, o SMTP do Brevo (veja deploy/README.md).
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_SENHA:}
    properties:
      # SMTP_TLS liga o STARTTLS e o login no servidor, os dois obrigatorios no Brevo.
      mail.smtp.auth: ${SMTP_TLS:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  tomcat:
    # Sem isso, num upload acima do limite o Tomcat fecha a conexao e o navegador ve
    # "erro de rede" em vez da resposta 413 com a mensagem.
    max-swallow-size: 100MB

campusconnect:
  seguranca:
    # Chave HMAC do JWT em Base64 (>= 32 bytes). Em producao, defina JWT_SECRET.
    # Vazia: gera uma chave aleatoria a cada subida (os JWTs antigos deixam de valer,
    # mas o frontend renova a sessao sozinho pelo refresh token).
    jwt-segredo: ${JWT_SECRET:}
    duracao-acesso: 15m
    # Refresh token com "Manter conectado" marcado.
    duracao-refresh: 30d
    # Refresh token sem "Manter conectado" (o cookie tambem some ao fechar o navegador).
    duracao-refresh-sessao: 1d
    # Secure: o cookie so trafega em HTTPS. Navegadores aceitam em http://localhost.
    cookie-seguro: ${COOKIE_SEGURO:true}
  arquivos:
    # Pasta das imagens enviadas (fotos e capas). Relativa a pasta em que a aplicacao sobe.
    diretorio: ${ARQUIVOS_DIR:uploads}
  aovivo:
    # Eventos ao vivo (SSE). A conexao nunca passa da validade do JWT que a abriu.
    duracao-maxima: 30m
    # Comentario vazio que mantem a conexao viva em proxies que cortam conexoes paradas.
    pulso: 25s
    maximo-por-pessoa: 5
  conversa:
    # Limite contra spam nas mensagens privadas.
    mensagens-por-minuto: 30
    conversas-novas-por-dia: 20
  verificacao:
    # Codigo de 6 digitos mandado para o e-mail no cadastro.
    validade-codigo: 15m
    tentativas-por-codigo: 5
    intervalo-reenvio: 60s
    envios-por-hora: 5
  email:
    # O "De:" dos e-mails. Em producao, um endereco do dominio verificado no Brevo.
    remetente: ${EMAIL_REMETENTE:CampusConnect <nao-responda@campusconnect.localhost>}
