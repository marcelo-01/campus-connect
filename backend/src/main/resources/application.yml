spring:
  application:
    name: campus-connect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusconnect}
    username: ${DB_USER:campusconnect}
    password: ${DB_PASSWORD:campusconnect}
  jpa:
    # O Flyway e dono do schema; o Hibernate apenas confere as entidades contra ele.
    hibernate:
      ddl-auto: validate
    open-in-view: false

campusconnect:
  seguranca:
    # Chave HMAC do JWT em Base64 (>= 32 bytes). Em producao, defina JWT_SECRET.
    # Vazia: gera uma chave aleatoria a cada subida (os JWTs antigos deixam de valer,
    # mas o frontend renova a sessao sozinho pelo refresh token).
    jwt-segredo: ${JWT_SECRET:}
    duracao-acesso: 15m
    # Refresh token com "Manter conectado" marcado.
    duracao-refresh: 30d
    # Refresh token sem "Manter conectado" (o cookie tambem some ao fechar o navegador).
    duracao-refresh-sessao: 1d
    # Secure: o cookie so trafega em HTTPS. Navegadores aceitam em http://localhost.
    cookie-seguro: ${COOKIE_SEGURO:true}
