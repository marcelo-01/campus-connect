<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CampusConnect</title>
  <base href="/">
  <!-- interactive-widget: no Chrome do Android, o teclado encolhe a página em vez de cobri-la, e o campo da
       conversa continua à mostra acima dele. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">

  <script>
    // O tema e a cor do menu de aparência, aplicados antes de o Angular subir, para a página não abrir clara e
    // depois escurecer. Daí em diante quem cuida é o AparenciaService: a chave e os valores têm de bater com os dele.
    (function () {
      var raiz = document.documentElement, escolha = {};
      try { escolha = JSON.parse(localStorage.getItem('campusconnect.aparencia')) || {}; } catch (e) {}
      var escuro = escolha.tema === 'escuro'
        || (escolha.tema !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      raiz.setAttribute('data-theme', escuro ? 'dark' : 'light');
      if (typeof escolha.cor === 'string') raiz.setAttribute('data-accent', escolha.cor);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
