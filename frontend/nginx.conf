# Frontend do CampusConnect em produção. Na VPS, um Caddy faz o HTTPS e manda tudo para cá.
# Este nginx serve o Angular e repassa /api para a API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # DNS do Docker. Com o endereço da API numa variável, o nginx resolve o nome a cada 10 s: sobe mesmo
    # com a API fora do ar e encontra o contêiner novo depois de um redeploy. Vai o nome do contêiner, e
    # não o do serviço, porque a rede compartilhada da VPS tem outros serviços chamados "api".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://campusconnect_api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Uploads: o Spring recusa acima de 60 MB com a mensagem dele. Aqui o limite só não pode ser menor.
        client_max_body_size 100m;
        # A conexão SSE de /api/aovivo dura até 30 min. A API responde com X-Accel-Buffering: no, então
        # o nginx repassa cada evento na hora, sem buffer.
        proxy_read_timeout 1h;
    }

    # Arquivos com hash no nome (main-XXXXXXXX.js e afins) trocam de nome a cada build.
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # As rotas do Angular caem no index.html.
    location / {
        try_files $uri /index.html;
    }

    # Sem cache, para um deploy novo valer na próxima vez que a página abrir.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
